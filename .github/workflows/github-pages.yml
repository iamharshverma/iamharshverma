# Builds the static portfolio and deploys it to GitHub Pages.
# Turn on/off with "githubPages.enabled" in deploy.config.json.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "enabled=$(jq -r '.githubPages.enabled // false' deploy.config.json)" >> "$GITHUB_OUTPUT"
          echo "domain=$(jq -r '.githubPages.customDomain // empty' deploy.config.json)" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.cfg.outputs.enabled == 'true'
        run: bun install
      - if: steps.cfg.outputs.enabled == 'true'
        run: bun run build:pages
        env:
          VITE_STATIC_SITE: "1"
      - if: steps.cfg.outputs.enabled == 'true'
        name: Prepare Pages folder
        run: |
          cp -r github-pages/__l5e dist/client/
          cd dist/client
          touch .nojekyll
          cp index.html 404.html
          if [ -n "${{ steps.cfg.outputs.domain }}" ]; then echo "${{ steps.cfg.outputs.domain }}" > CNAME; fi
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
